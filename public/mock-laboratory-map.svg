    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#e9eff4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#15314b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="#d9e1e7"/>
  <rect x="22" y="22" width="856" height="476" rx="14" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="38" y="38" width="824" height="444" rx="8" fill="url(#grid)"/>

