<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f6f8">
  <title>复合机器人调度系统 · 充电桩与电池配置</title>
  <link rel="stylesheet" href="assets/styles/tokens.css">
  <link rel="stylesheet" href="assets/styles/base.css">
  <link rel="stylesheet" href="assets/styles/components.css">
  <link rel="stylesheet" href="assets/styles/pages/charging-and-battery.css">
  <script type="module" src="assets/components/register.js" blocking="render"></script>
</head>
<body>
  <agv-app-shell active-route="charging-and-battery.html" section-title="充电桩与电池配置" user-name="陈工">
    <div class="agv-legacy-hooks" hidden>
      <button id="statusInfoBtn" type="button"></button><button id="statusBtn" type="button"></button>
      <button id="alertInfoBtn" type="button"></button><button id="alertBtn" type="button"></button>
    </div>

    <agv-page-header class="page-head">
      <div><h1>充电桩与电池配置</h1><p>维护充电设备、电池参数及低电量调度策略</p></div>
      <button class="primary-btn" id="addConfig" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="addConfigText">新增充电桩</span></button>
    </agv-page-header>

    <main class="page-canvas charging-page">
      <section class="config-panel">
        <header class="panel-toolbar">
          <div class="config-tabs" role="tablist" aria-label="配置类型">
            <button class="config-tab active" type="button" role="tab" aria-selected="true" data-tab="piles">充电桩配置</button>
            <button class="config-tab" type="button" role="tab" aria-selected="false" data-tab="batteries">电池配置</button>
          </div>
          <button class="secondary-btn test-button" id="testConnection" type="button"><svg viewBox="0 0 24 24"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg>连接测试</button>
        </header>

        <div class="table-wrap" id="pilePanel" role="tabpanel">
          <table aria-label="充电桩配置列表">
            <thead><tr><th>桩编号</th><th>品牌</th><th>型号</th><th>所属空间（地图）</th><th>通信协议</th><th>额定功率</th><th>关联导航点</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="pileRows"></tbody>
          </table>
        </div>

        <div class="table-wrap" id="batteryPanel" role="tabpanel" hidden>
          <table aria-label="电池配置列表">
            <thead><tr><th>配置编号</th><th>电池品牌</th><th>电池型号</th><th>电池类型</th><th>额定电压 / 容量</th><th>低电量阈值</th><th>恢复任务阈值</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="batteryRows"></tbody>
          </table>
        </div>
        <footer class="table-footer"><span id="configTotal">共 2 条数据</span><div class="pagination"><button type="button" disabled>‹</button><button class="active" type="button">1</button><button type="button" disabled>›</button></div></footer>
      </section>
    </main>
  </agv-app-shell>

  <div class="modal-overlay" id="configModal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="configModalTitle">
      <div class="modal-title-row"><div><h2 id="configModalTitle">新增充电桩</h2><p id="configModalDescription">维护充电桩品牌、协议和运行状态</p></div><button class="modal-x" type="button" data-close="configModal" aria-label="关闭">×</button></div>
      <form id="configForm" class="form-grid"></form>
    </section>
  </div>

  <div class="modal-overlay" id="statusModal" hidden><section class="modal-card small-modal" role="dialog" aria-modal="true"><h2>系统运行状态</h2><div class="status-note"><strong>充电配置运行正常</strong><p>充电桩通信服务与电池策略配置连接正常。</p></div><div class="modal-actions"><button class="modal-close" type="button" data-close="statusModal">关闭</button></div></section></div>
  <div class="alert-overlay" id="alertDrawer" hidden><aside class="alert-drawer" role="dialog" aria-modal="true"><header><h2>异常提醒</h2><p>当前无充电设备异常</p></header><div class="alert-empty">暂无充电桩或电池配置异常</div><footer><a href="current-anomalies.html">进入异常与恢复</a></footer></aside></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="charging-and-battery.js"></script>
</body>
</html>
