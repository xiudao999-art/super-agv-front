<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>复合机器人调度系统 · 外围资源</title>
  <link rel="stylesheet" href="assets/styles/pages/peripheral-resources.css">
  <link rel="stylesheet" href="assets/styles/tokens.css">
  <link rel="stylesheet" href="assets/styles/base.css">
  <link rel="stylesheet" href="assets/styles/components.css">
  <script type="module" src="assets/components/register.js" blocking="render"></script>
  <script src="lab-peripheral-api.js" defer></script>
</head>
<body>
  <agv-app-shell active-route="peripheral-resources.html" section-title="外围资源" user-name="陈工">
    <div class="agv-legacy-hooks" hidden>
      <aside id="sidebar"></aside><div id="scrim"></div><button id="menuBtn" type="button"></button>
      <button id="statusInfoBtn" type="button"></button><button id="statusBtn" type="button"></button>
      <button id="alertInfoBtn" type="button"></button><button id="alertBtn" type="button"></button>
    </div>
    <agv-page-header class="page-head"><div><h1>外围资源</h1></div></agv-page-header>
    <main class="page-canvas resource-page">
      <section class="page-panel resource-panel">
        <div class="content">
          <div class="list-head resource-head">
            <div><h2>外部设备</h2></div>
            <div class="tools">
              <button class="tool-btn primary" id="addPeripheral" type="button">
                <svg class="icon"><use href="assets/icons.svg#i-plus"/></svg>新增外部设备
              </button>
              <button class="tool-btn test-btn" id="testAllPeripheral" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg>连接测试
              </button>
            </div>
          </div>
          <div class="table-wrap resource-table-wrap">
            <table class="resource-table" aria-label="外围资源列表">
              <thead><tr><th>资源编号 / 名称</th><th>设备类型</th><th>所属 / 连接空间（地图）</th><th>地图坐标或两端连接点</th><th>通信 / 码流</th><th>关联导航点</th><th>状态</th><th>操作</th></tr></thead>
              <tbody id="resourceRows"></tbody>
            </table>
          </div>
          <div class="total" id="resourceTotal">共计 0 条数据</div>
        </div>
      </section>
    </main>
  </agv-app-shell>

  <div class="modal-overlay" id="peripheralModal" hidden>
    <section class="modal-card peripheral-modal-card" role="dialog" aria-modal="true" aria-labelledby="peripheralModalTitle">
      <header class="resource-modal-head">
        <div><h2 id="peripheralModalTitle">新增外围资源</h2><p>挂载外部设备，维护空间位置、通信参数与运行状态</p></div>
        <button class="modal-x" id="peripheralModalClose" type="button" aria-label="关闭">×</button>
      </header>
      <form id="peripheralForm">
        <div class="form-grid">
          <label class="form-field"><span>资源编号</span><input id="resourceCode" maxlength="64" placeholder="例如：D-01" required></label>
          <label class="form-field"><span>设备名称</span><input id="resourceName" maxlength="64" placeholder="例如：检测工位摄像机" required></label>
          <label class="form-field"><span>设备类型</span><select id="resourceType" required><option value="摄像机">摄像机</option><option value="自动门">自动门</option><option value="电梯">电梯</option></select></label>
          <label class="form-field"><span>状态</span><select id="resourceStatus"><option value="在线">在线</option><option value="可用">可用</option><option value="备用">备用</option><option value="离线">离线</option></select></label>
          <label class="form-field wide"><span>所属 / 连接空间（地图）</span><input id="resourceSpace" placeholder="例如：空间 A / 总览地图 V3.2" required></label>
          <label class="form-field wide"><span>地图坐标或两端连接点</span><textarea id="resourceCoordinate" placeholder="例如：X 18.400 / Y 3.200 / θ 90.0°" required></textarea></label>
          <label class="form-field"><span>关联导航点</span><input id="resourceNavPoint" placeholder="例如：DOOR-A-01" required></label>
          <fieldset class="camera-fields wide" id="cameraFields" hidden>
            <legend>摄像机通信参数</legend>
            <div class="camera-field-grid">
              <label class="form-field"><span>IP 地址</span><input id="resourceCameraIp" inputmode="decimal" placeholder="例如：192.168.20.31"></label>
              <label class="form-field"><span>端口</span><input id="resourceCameraPort" type="number" min="1" max="65535" placeholder="例如：554"></label>
              <label class="form-field"><span>视频协议</span><select id="resourceCameraProtocol"><option value="RTSP">RTSP</option><option value="HTTP">HTTP</option><option value="ONVIF">ONVIF</option></select></label>
              <label class="form-field"><span>分辨率</span><select id="resourceResolution"><option value="1920×1080">1920×1080</option><option value="1280×720">1280×720</option><option value="640×480">640×480</option></select></label>
              <label class="form-field wide"><span>码流地址</span><input id="resourceStreamUrl" placeholder="例如：rtsp://192.168.20.31:554/stream1"></label>
              <label class="form-field"><span>帧率（FPS）</span><input id="resourceFrameRate" type="number" min="1" max="60" placeholder="例如：25"></label>
              <label class="form-field"><span>检测画面地址（可选）</span><input id="resourcePreviewUrl" placeholder="PNG / JPG / WebP 图片地址"></label>
            </div>
            <p>实时预览默认显示检测画面；配置检测截图地址后，AGV 产能页面会优先加载该图片。</p>
          </fieldset>
          <label class="form-field wide"><span>备注</span><textarea id="resourceRemark" placeholder="可填写通信方式、预约规则等说明"></textarea></label>
        </div>
        <div class="modal-actions"><button class="modal-close" id="peripheralCancel" type="button">取消</button><button class="modal-primary" type="submit">保存</button></div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
